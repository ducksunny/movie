<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>숲속의 영화 정리함</title>
    <style>
        /* 디자인: 자연 친화적인 초록색 테마 */
        body {
            background-color: #e8f5e9;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { color: #2e7d32; margin-bottom: 30px; }

        /* 티어 표 스타일 */
        .tier-board {
            width: 95%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .tier-row {
            display: flex;
            min-height: 140px;
            border-bottom: 1px solid #eee;
        }

        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.8rem;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* 티어별 색상 */
        .s-tier { background-color: #ffd700; color: #5d4037; } /* 금색 */
        .a-tier { background-color: #ff8c00; } /* 주황 */
        .b-tier { background-color: #4fc3f7; } /* 하늘 */
        .c-tier { background-color: #b0bec5; } /* 회색 */

        .tier-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 15px;
            gap: 12px;
            background-color: #fafafa;
        }

        /* 영화 포스터 카드 스타일 */
        .movie-card {
            width: 90px;
            height: 130px;
            cursor: grab;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            background-color: #ddd;
        }

        .movie-card:hover { transform: scale(1.05); }
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* 이미지 드래그 방해 금지 */
        }

        /* 하단 후보군 영역 */
        .candidate-pool {
            width: 95%;
            max-width: 900px;
            min-height: 160px;
            background: #c8e6c9;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            border: 2px dashed #81c784;
        }

        .pool-title {
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
            color: #1b5e20;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>🌿 숲속의 영화 정리함</h1>

    <div class="tier-board">
        <div class="tier-row">
            <div class="tier-label s-tier">S</div>
            <div class="tier-content" id="tier-S" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label a-tier">A</div>
            <div class="tier-content" id="tier-A" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label b-tier">B</div>
            <div class="tier-content" id="tier-B" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label c-tier">C</div>
            <div class="tier-content" id="tier-C" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
    </div>

    <div class="candidate-pool" id="pool" ondrop="drop(event)" ondragover="allowDrop(event)">
        <div class="pool-title">분류 대기 중인 영화</div>
        
        <!-- 영화 포스터 5개 (이미지 주소는 예시입니다) -->
        <div class="movie-card" id="movie-1" draggable="true" ondragstart="drag(event)">
            <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyMTA2MDhfMjY5%2FMDAxNjIzMTI4NjU3Nzc0.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.JPEG.sksmsdlfma%2F%25B1%25E2%25BB%25FD%25C3%25E1.jpg" alt="기생충">
        </div>
        <div class="movie-card" id="movie-2" draggable="true" ondragstart="drag(event)">
            <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyMTA1MjRfMTYy%2FMDAxNjIxODQzNjYwNjYw.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.JPEG.sksmsdlfma%2F%25C0%25CE%25C1%25A6%25C2%25C7.jpg" alt="인셉션">
        </div>
        <div class="movie-card" id="movie-3" draggable="true" ondragstart="drag(event)">
            <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyMTA1MjRfMTYy%2FMDAxNjIxODQzNjYwNjYw.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.JPEG.sksmsdlfma%2F%25BE%25EE%25B9%25D9%25BE%25F6%25C5%25B8%25C0%25D3.jpg" alt="어바웃타임">
        </div>
        <div class="movie-card" id="movie-4" draggable="true" ondragstart="drag(event)">
            <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyMTA1MjRfMTYy%2FMDAxNjIxODQzNjYwNjYw.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.JPEG.sksmsdlfma%2F%25C5%25E4%25C0%25CC%25BD%25BA%25C5%25E4%25B8%25AE.jpg" alt="토이스토리">
        </div>
        <div class="movie-card" id="movie-5" draggable="true" ondragstart="drag(event)">
            <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyMTA1MjRfMTYy%2FMDAxNjIxODQzNjYwNjYw.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.vXp-vP9K0-Y5-YvY-YvY-YvY-YvY-YvY-YvY-YvY-YvYg.JPEG.sksmsdlfma%2F%25BE%25BE%25B9%25D9%25C5%25B8.jpg" alt="아바타">
        </div>
    </div>

    <script>
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            // 드롭 위치가 tier-content 내부이거나 pool일 때만 이동
            let target = ev.target;
            while (target && !target.classList.contains('tier-content') && target.id !== 'pool') {
                target = target.parentElement;
            }

            if (target) {
                target.appendChild(draggedElement);
                saveData();
            }
        }

        function saveData() {
            const positions = {};
            document.querySelectorAll('.movie-card').forEach(movie => {
                positions[movie.id] = movie.parentElement.id;
            });
            localStorage.setItem('movieTierDataV2', JSON.stringify(positions));
        }

        function loadData() {
            const savedData = localStorage.getItem('movieTierDataV2');
            if (savedData) {
                const positions = JSON.parse(savedData);
                for (const [movieId, parentId] of Object.entries(positions)) {
                    const movie = document.getElementById(movieId);
                    const parent = document.getElementById(parentId);
                    if (movie && parent) parent.appendChild(movie);
                }
            }
        }
        window.onload = loadData;
    </script>
</body>
</html>
